const frameNotes={"赢字架": "把赢、嬴等字共用的外部结构看作一个字架，先取赢架，再拆其中变化的部分。例如：赢＝赢架＋贝；嬴＝赢架＋女。", "行": "左右两部分合起来算“行”字架，先取行，再拆夹在中间的部分。例如：衍＝行＋氵；街＝行＋土＋土。", "衣": "分开的衣字外形合起来算“衣”字架，先取衣，再拆包在中间的部分。例如：哀＝衣＋口；裹＝衣＋果。"};
function render(){const k=$('#kind').value,s=saved[k],r=s.records[0],x=decks[k][r[1]];$('#kind').disabled=active;$('#reset').disabled=active;$('#import-progress').disabled=active;$('#pause').hidden=!active;$('#start').hidden=active;$('#answer').disabled=!active;$('#progress').textContent=`已熟悉 ${s.records.filter(r=>r[0]>1).length}/${s.records.length} · 作答 ${s.answers} · 错误 ${s.errors}`;$('#root').innerHTML=active?(x.成员||[x.根]).map(n=>'<span class="practice-root">'+escapeHtml(rootLabel(n))+'</span>').join(''):'准备练习';$('#key-hint').hidden=!(active&&r[0]===-1);$('#key-hint').textContent=active&&r[0]===-1?x.键.toUpperCase():'';$('#members').textContent=active&&x.成员?'归并组：'+rootLabel(x.根):'';$('#family-hint').hidden=!(active&&x.归并提示);$('#family-hint').textContent=active&&x.归并提示?'该根与'+x.归并提示+'根归并。':'';$('#example').innerHTML=active?examplesHtml(x):'';const frames=active?(x.成员||[x.根]).filter(n=>frameNotes[n]):[];$('#frame-notes').hidden=!frames.length;$('#frame-notes').innerHTML=frames.map(n=>'<p><strong>'+escapeHtml(rootLabel(n))+'</strong>：'+escapeHtml(frameNotes[n])+'</p>').join('');$('#hint').textContent=active?(r[0]===-1?'首次学习 / 重新记忆，请输入右侧字母':'请输入对应字母键'):'点击开始，继续本模式已保存的进度。';$('#answer').value='';if(active)$('#answer').focus()}
function answer(key){if(!active)return;const k=$('#kind').value,s=saved[k],r=s.records[0],x=decks[k][r[1]];s.answers++;if(key!==x.键){r[0]=-1;s.errors++;persist();render();$('#hint').textContent='答错了，请按右侧字母重新输入';return}r[0]=Math.min(8,r[0]+1);const steps=[2,4,8,12,20,30,60,100];const step=Math.min(r[0]>=8?s.records.length-1:steps[r[0]],s.records.length-1);s.records.shift();s.records.splice(step,0,r);persist();render()}
$('#start').onclick=()=>{active=true;render()};$('#pause').onclick=()=>{active=false;persist();render()};$('#kind').onchange=render;
$('#reset').onclick=()=>{if(confirm('清空当前练习模式的本地进度，从第一题重新学习？')){saved[$('#kind').value]=fresh($('#kind').value);persist();render()}};
$('#answer').addEventListener('input',e=>{if(e.isComposing)return;const v=e.target.value.toLowerCase();if(!v)return;if(/^[a-z ]$/.test(v))answer(v);else{$('#answer').value='';$('#hint').textContent='请切换英文输入，只输入一个字母。'}});

function progressPackage(){return {format:'nightingale-root-practice',version:1,exportedAt:new Date().toISOString(),mode:$('#kind').value,progress:{group:saved.group,all:saved.all}}}
function parseProgress(text){
 const p=JSON.parse(text.replace(/^\uFEFF/,''));
 if(!p||p.format!=='nightingale-root-practice'||p.version!==1||!['group','all'].includes(p.mode)||!p.progress)throw Error('不是受支持的字根练习进度文件。');
 const next={};
 for(const k of ['group','all']){const s=upgradeAppend(p.progress[k],k);
 if(!s||!Array.isArray(s.records)||!s.records.every(r=>Array.isArray(r)&&r.length===2)||!valid(s,k)||!Number.isSafeInteger(s.answers)||s.answers<0||!Number.isSafeInteger(s.errors)||s.errors<0||s.errors>s.answers)throw Error('进度数据无效或题库不匹配，未修改当前进度。');
 next[k]={signature:s.signature,records:s.records.map(r=>[...r]),answers:s.answers,errors:s.errors};
 }
 return {mode:p.mode,progress:next};
}
$('#export-progress').onclick=()=>{
 const blob=new Blob([JSON.stringify(progressPackage(),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='夜莺字根练习进度_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 $('#transfer-status').textContent='已导出两种模式的进度文件，请保留下载的 JSON 文件。';
};
$('#import-progress').onclick=()=>{if(active)return;$('#progress-file').value='';$('#progress-file').click()};
$('#progress-file').onchange=async()=>{
 const file=$('#progress-file').files[0];if(!file)return;
 try{
 if(active)throw Error('请先暂停练习再导入。');if(file.size>1024*1024)throw Error('文件过大，请选择导出的进度 JSON 文件。');
 const incoming=parseProgress(await file.text());if(active)throw Error('请先暂停练习再导入。');
 const summary=['group','all'].map(k=>(k==='group'?'归并组':'全部根形')+'：作答 '+incoming.progress[k].answers+'，错误 '+incoming.progress[k].errors).join('\n');
 if(!confirm('导入以下进度，将替换当前两种模式的进度：\n'+summary+'\n确定导入？'))return;
 localStorage.setItem(STORAGE+'_before_import',JSON.stringify(saved));
 localStorage.setItem(STORAGE,JSON.stringify(incoming.progress));
 saved=incoming.progress;$('#kind').value=incoming.mode;active=false;render();persist();$('#transfer-status').textContent='导入成功，点击“开始 / 继续”接着练习。';
 }catch(e){$('#transfer-status').textContent='导入失败：'+e.message}
 finally{$('#progress-file').value=''}
};
