algebra:
  声母四分:
    - type: xform
      from: ^[nm]g\d$
      to: 零开
    - type: xform
      from: ^([bpmfdtnlgkhjqxzcsr]h?|yu?|[aoew]).+$
      to: $1
    - type: xform
      from: ^w$
      to: 零合
    - type: xform
      from: ^y$
      to: 零齐
    - type: xform
      from: ^yu$
      to: 零撮
    - type: xform
      from: ^[aoe]$
      to: 零开
  韵头:
    - type: xform
      from: ((?<=[jqx])u|yu|v)
      to: ü
    - type: xform
      from: yi?
      to: i
    - type: xform
      from: wu?
      to: u
    - type: xform
      from: iu
      to: iou
    - type: xform
      from: u([in])
      to: ue$1
    - type: xform
      from: ^.*?([aeiouü].*|m|ng?)\d$
      to: $1
    - type: xform
      from: ao
      to: au
    - type: xform
      from: ^(?=[mn])
      to: 零
    - type: xform
      from: (.+)[iunm]g?$
      to: $1
  韵尾:
    - type: xform
      from: ^([jqxy])u
      to: $1v
    - type: xform
      from: ao
      to: au
    - type: xform
      from: yi?
      to: i
    - type: xform
      from: wu?
      to: u
    - type: xform
      from: iu
      to: iou
    - type: xform
      from: u([in])
      to: ue$1
    - type: xform
      from: ^.*?([aeiouv].*|m|ng?)\d$
      to: $1
    - type: xform
      from: ^(?=[mn])
      to: 零
    - type: xform
      to: $1
      from: ^.+?([iunm]|ng)?$
    - type: xform
      from: ^$
      to: 零
  补码:
    - type: xform
      from: ^.+$
      to: 补
optimization:
  objective:
    characters_short:
      duplication: 1
      pair_equivalence: 1
