schema:
  schema_id: yeying25_shape
  name: 夜莺2.5·形码
  version: "2.5-shape.2"
  author: [夜莺作者 losWater]
  description: 夜莺2.5固定码表，沿用本机虎码的手动选词方式，不使用整句模型。
  dependencies: [yeying25_mac_rime_fixed]

switches:
  - name: ascii_mode
    states: [中文, 西文]
  - name: ascii_punct
    states: [中文标点, 英文标点]
  - name: chaifen
    reset: 0
    states: [拆分隐藏, 拆分显示]
  - name: simplification
    reset: 0
    states: [简体输出, 繁体输出]

engine:
  processors:
    - lua_processor@*yeying25_mac_lookup_key
    - lua_processor@*yeying25_shape_words
    - lua_processor@*yeying25_mac_pin_key
    - lua_processor@*yeying25_shape_lookup_input
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators:
    - lua_translator@*yeying25_mac_lookup
    - punct_translator
    - lua_translator@*yeying25_shape_table
    - history_translator@repeat_last
    - history_translator@repeat_last_right
  filters:
    - lua_filter@*yeying25_shape_comment
    - lua_filter@*yeying25_shape_words_filter
    - simplifier@simplification
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz[]"
  # Some valid Nightingale words have no exact three-key prefix candidate.
  # Do not clear that unfinished prefix before the fourth key arrives.
  auto_clear: max_length
  max_code_length: 4
  # Keep four keys pending; the next letter confirms the selected candidate.
  auto_select: false

translator:
  dictionary: yeying25_mac_rime_fixed
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  enable_encoder: false
  encode_commit_history: false

menu:
  page_size: 9
punctuator:
  import_preset: default
key_binder:
  import_preset: default
  bindings:
    - {when: has_menu, accept: semicolon, send: 2}
    - {when: has_menu, accept: apostrophe, send: 3}
    - {when: composing, accept: Tab, send: Escape}
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: has_menu, accept: Right, send: Down}
    - {when: has_menu, accept: Left, send: Up}
    - {when: composing, accept: "Control+j", toggle: chaifen}
    - {when: composing, accept: "Control+o", toggle: simplification}
    - {when: always, accept: "Control+period", toggle: ascii_punct}
recognizer:
  import_preset: default
  patterns:
    yeying25_mac_lookup: '^([`~][a-z]*|~~[a-z]*)$'
simplification:
  option_name: simplification
  opencc_config: s2t.json
  tips: all
repeat_last:
  input: "["
  size: 1
  initial_quality: 100
repeat_last_right:
  input: "]"
  size: 1
  initial_quality: 100
