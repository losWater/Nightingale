<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜莺2.0 · 拆分查询</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f1eb;color:#243a3a;font:17px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1150px;margin:40px auto;padding:0 24px}header{margin-bottom:26px}h1{font-size:32px;margin:6px 0}p{margin:8px 0}.muted{color:#61716b;font-size:14px}.search{position:sticky;top:0;background:#f2f1eb;padding:14px 0;z-index:2}input{width:100%;border:2px solid #d7ddd1;border-radius:10px;padding:15px;font:inherit;background:#faf9f4}input:focus{outline:2px solid #366d62}select{font:inherit;padding:8px;margin:5px}button{cursor:pointer;border:1px solid #d7ddd1;border-radius:6px;padding:7px 12px;background:#faf9f4;color:#243a3a;margin:8px 5px 0 0;font:inherit}button:hover{background:#edf0e6}article{background:#faf9f4;border:1px solid #d7ddd1;border-radius:12px;padding:22px;margin:18px 0}.head{display:flex;align-items:center;gap:20px}.char{font-size:42px;font-weight:bold}.tag{color:#366d62;font-size:14px}.roots{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0}.root{padding:10px 17px;background:#edf0e6;border-radius:8px;text-align:center}.root b{font-size:24px}.root span{display:block;font:16px monospace;color:#366d62}.plus{color:#61716b}code{font:18px Consolas,monospace;color:#366d62}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:9px;border-bottom:1px solid #d7ddd1;text-align:left}th{font-size:14px;color:#61716b}summary{cursor:pointer;margin-top:14px}td:last-child{overflow-wrap:anywhere}a{color:#366d62}.notice{border-left:3px solid #c49b54;padding-left:12px}@media(max-width:600px){main{padding:0 12px}article{padding:14px}.root{padding:8px}h1{font-size:26px}}
#rootpicker{display:flex;flex-wrap:wrap;gap:7px}#rootpicker button{margin:0;text-align:left}#rootpicker small{display:block;font-size:12px;color:#61716b}#rootpicker button[aria-pressed="true"]{background:#e3eadc;border-color:#366d62}.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;margin:18px 0}.char-grid button{margin:0;padding:12px 6px;text-align:center;border-radius:10px}.char-grid b{display:block;font-size:32px}.char-grid small{display:block;color:#61716b;font-size:12px}</style><main><header><p class="muted">夜莺2.0</p><h1>拆分查询</h1><p>输入汉字查看拆分，输入编码优先显示完全匹配，再按字频列出前缀匹配；切换“部件反查”可查询含该根的字，按字频排列。反查依据当前拆分记录。</p><p class="muted">覆盖8105字 · 支持输入编码或字根名称反查 · 本地离线可用</p></header><div class="search"><div><label>查询方式 <select id="mode"><option value="auto">查字 / 编码</option><option value="root">部件反查</option></select></label> <label>部件位置 <select id="pos"><option value="any">字中任意位置</option><option value="edge">首根或末根</option><option value="first">首根</option><option value="last">末根</option></select></label> <label>显示 <select id="limit"><option value="100">前100字</option><option value="500">前500字</option><option value="99999">全部</option></select></label></div><datalist id="rootnames"></datalist><input id="q" aria-label="查询汉字、编码或字根" placeholder="输入汉字或编码" autocomplete="off"></div><div id="rootpicker" aria-label="选择部件"></div><p id="status" class="muted"></p><div id="out"></div><p class="muted">显示当前2.0单字编码；字词版候选顺序可能不同。</p></main>
<script>const ROOTS=__ROOTS__;let selectedRoot="";const D=__DATA__;const q=document.querySelector('#q'),out=document.querySelector('#out'),status=document.querySelector('#status');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(detailChar=""){let v=q.value.trim(),cs=[],missing=[];const picker=document.querySelector("#rootpicker");picker.innerHTML="";if(!v){out.innerHTML='';status.textContent='输入文字开始查询。';return;}if(document.querySelector("#mode").value==="root"){
if(/^[a-zA-Z]$/.test(v)){
 const choices=ROOTS.filter(r=>r.键===v.toLowerCase());
 picker.innerHTML=choices.map(r=>`<button type="button" data-root="${esc(r.根)}" aria-pressed="${selectedRoot===r.根}"><b>${esc(r.根)}</b><small>${esc(r.组)} · ${r.键.toUpperCase()}</small></button>`).join('');
 picker.querySelectorAll('[data-root]').forEach(b=>b.onclick=()=>{selectedRoot=b.dataset.root;render()});
 if(!choices.some(r=>r.根===selectedRoot)){out.innerHTML='';status.textContent=`${v.toUpperCase()} 键共有 ${choices.length} 个部件，请点击选择。`;return}
 v=selectedRoot;
}
cs=Object.keys(D).filter(c=>{const rs=D[c].根,p=document.querySelector("#pos").value;return (p==="first"?[rs[0]]:p==="last"?[rs.at(-1)]:p==="edge"?[rs[0],rs.at(-1)]:rs).some(r=>r.根===v);});cs.sort((a,b)=>(D[a].排名??999999)-(D[b].排名??999999));}else if(/^[a-z]+$/.test(v)){cs=Object.keys(D).filter(c=>D[c].编码.some(x=>x.码.startsWith(v)));cs.sort((a,b)=>Number(D[b].编码.some(x=>x.码===v))-Number(D[a].编码.some(x=>x.码===v))||(D[a].排名??999999)-(D[b].排名??999999));}else if([...v].some(c=>!D[c]&&!/\s|[,，、；;]/.test(c))){cs=Object.keys(D).filter(c=>D[c].根.some(r=>r.根===v||r.组===v));if(!cs.length){cs=[...new Set([...v].filter(c=>D[c]))];missing=[...new Set([...v].filter(c=>!D[c]&&!/\s|[,，、；;]/.test(c)))];}}else cs=[...new Set([...v].filter(c=>D[c]))];const limit=Number(document.querySelector('#limit').value);status.textContent=`找到 ${cs.length} 字`+(cs.length>limit?`，先显示${limit}字，可切换显示全部。`:'。')+(missing.length?' 未收录：'+missing.join('、'):'');const rootMode=document.querySelector('#mode').value==='root';
const detail=rootMode&&typeof detailChar==='string'&&cs.includes(detailChar)?detailChar:'';
if(rootMode&&!detail){
 out.innerHTML='<div class="char-grid">'+cs.slice(0,limit).map(c=>`<button type="button" data-char="${esc(c)}" aria-label="查看${esc(c)}的完整信息"><b>${esc(c)}</b><small>字频 ${D[c].排名??'—'}</small></button>`).join('')+'</div>';
 out.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>render(b.dataset.char));return;
}
out.innerHTML=(detail?'<button type="button" id="back-to-chars">← 返回选字</button>':'')+(detail?[detail]:cs.slice(0,limit)).map(c=>{let r=D[c];const matchedCodes=document.querySelector('#mode').value!=='root'&&/^[a-z]+$/.test(v)?r.编码.filter(x=>x.码.startsWith(v)):r.编码;return `<article><div class="head"><div class="char">${esc(c)}</div><div><div>字频排名 ${r.排名??'—'}</div></div></div><div class="roots">${r.根.map(x=>`<div class="root" title="${esc(x.组)}"><b>${esc(x.根)}</b><span>${esc(x.键)}</span></div>`).join('<span class="plus">＋</span>')}</div><p>首根：${esc(r.根[0].根)} <code>${r.根[0].键}</code>　末根：${esc(r.根.at(-1).根)} <code>${r.根.at(-1).键}</code></p><table><tr><th>类别</th><th>实际编码</th><th>单字候选位</th></tr>${matchedCodes.map(x=>`<tr><td>${x.码.length===4?'全码':x.码.length+'码'}${c==='六'&&x.码==='lqq'?'（无理码）':''}</td><td><code>${esc(x.码)}</code></td><td>${x.位===1?'首选':'第'+x.位+'候选'}</td></tr>`).join('')}</table>${matchedCodes.filter(x=>x.码.length===4&&x.同码.length>1).map(x=>`<p class="collision"><strong>全码 ${esc(x.码)} 同码字：</strong>${x.同码.map((z,i)=>`<span>${i+1}. ${z===c?`<strong>${esc(z)}（本字）</strong>`:esc(z)}</span>`).join('　')}</p>`).join('')}</article>`}).join('');if(detail)document.querySelector('#back-to-chars').onclick=()=>render();}
document.querySelector('#rootnames').innerHTML=[...new Set(ROOTS.map(r=>r.根))].sort().map(x=>`<option value="${esc(x)}"></option>`).join('');
function modeChange(){selectedRoot="";const isRoot=document.querySelector('#mode').value==='root';if(isRoot)q.setAttribute('list','rootnames');else q.removeAttribute('list');document.querySelector('#pos').disabled=!isRoot;q.placeholder=isRoot?'输入部件名 / 字形，或单个字母选部件':'输入汉字或编码';render()}
document.querySelector('#mode').onchange=modeChange;document.querySelector('#pos').onchange=render;document.querySelector('#limit').onchange=render;document.querySelector('#pos').disabled=true;
q.addEventListener('input',()=>{selectedRoot='';render()});q.value=decodeURIComponent(location.hash.slice(1)||'');render();</script></html>
