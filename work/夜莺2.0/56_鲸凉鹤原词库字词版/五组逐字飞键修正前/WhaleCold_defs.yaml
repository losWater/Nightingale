# 该文件逻辑上属于 WhaleCold.yaml，但由于 librime 的限制，只能单独为一个文件

# 模糊音定义
bufen:
  z_zh:
    __append:
      - derive/^z/v/
      - derive/^v/z/
  c_ch:
    __append:
      - derive/^c/i/
      - derive/^i/c/
  s_sh:
    __append:
      - derive/^s/u/
      - derive/^u/s/
  n_l:
    __append:
      - derive/^n/l/
      - derive/^l/n/
  h_f:
    __append:
      - derive/^h/f/
      - derive/^f/h/
  in_ing:
    __append:
      - derive/n;/y;/
      - derive/y;/n;/
  en_eng:
    __append:
      - derive/f;/g;/
      - derive/g;/f;/

# 恢复老自然码 jv qv xv yv 打法
classic_zrm_jqx:
  __append:
    - derive/^ju/jv/
    - derive/^qu/qv/
    - derive/^xu/xv/
    - derive/^yu/yv/

# 飞键
fly:
  cs_cl: { __append: [ derive/cs;/cl;/ ] }
  dc_dl: { __append: [ derive/dc;/dl;/ ] }
  gr_gp: { __append: [ derive/gr;/gp;/ ] }
  gv_gi: { __append: [ derive/gv;/gi;/ ] }
  jm_jz: { __append: [ derive/jm;/jz;/ ] }
  lp_lf: { __append: [ derive/lp;/lf;/ ] }
  mj_mr: { __append: [ derive/mj;/mr;/ ] }
  mu_mx: { __append: [ derive/mu;/mx;/ ] }
  nj_nz: { __append: [ derive/nj;/nz;/ ] }
  pi_pe: { __append: [ derive/pi;/pe;/ ] }
  pk_px: { __append: [ derive/pk;/px;/ ] }
  po_ps: { __append: [ derive/po;/ps;/ ] }
  qx_qo: { __append: [ derive/qx;/qo;/ ] }
  tv_tl: { __append: [ derive/tv;/tl;/ ] }
  uj_us: { __append: [ derive/uj;/us;/ ] }
  vg_vk: { __append: [ derive/vg;/vk;/ ] }
  xq_xo: { __append: [ derive/xq;/xo;/ ] }
  yj_yf: { __append: [ derive/yj;/yf;/ ] }
  yu_yg: { __append: [ derive/yu;/yg;/ ] }
  zs_zl: { __append: [ derive/zs;/zl;/ ] }

# 19键键盘映射
keyboard19:
  __append:
    - 'derive/[we]/W/'
    - 'derive/[rt]/R/'
    - 'derive/[op]/O/'
    - 'derive/[fg]/F/'
    - 'derive/[jk]/J/'
    - 'derive/[xc]/X/'
    - 'derive/[bn]/B/'

# 小写可匹配大写编码（用于英语混输）
casefold:
  __append:
    - derive/([A-Z])/\L$1\E/

# 大写首字母可匹配小写词语
flexible_caps:
  __append:
    - derive/^([a-z])/\U$1\E/

# 英语化部分非字母编码（用于英语混输）
englishify_nonletter:
  __append:
    # 数字，转换为对应的读音缩写
    # 如 21 转换为 euy
    - derive/10/u/                  # u, yl
    - derive/1([1-9])/u$1/          # uy, ue, us, ...
    - derive/([2-9])([0-9])/$1u$2/  # euy, eue, eus, ...
    - xlit/0123456789/lyesswlqbj/
