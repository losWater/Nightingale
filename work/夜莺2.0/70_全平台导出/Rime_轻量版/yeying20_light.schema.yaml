schema:
  schema_id: yeying20_light
  name: 夜莺2.0·轻量
  version: 2.0-20260914
  dependencies:
  - yeying20_rime_fixed
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
switches:
- name: ascii_mode
  reset: 0
  states:
  - 中文
  - 西文
- name: ascii_punct
  states:
  - 。，
  - ．，
engine:
  processors:
  - lua_processor@*yeying20_lookup_key
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - lua_translator@*yeying20_lookup
  - punct_translator
  - lua_translator@*yeying20_mix
  filters:
  - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: ' '''
  algebra:
  - derive/^(\w{2});\w\w$/$1/
  - derive/^(\w{2});(\w)\w$/$1$2/
  - xform/^(\w{2});(\w)(\w)$/$1$2$3/
translator:
  dictionary: yeying20_rime
  user_dict: yeying20_light
  enable_user_dict: true
  enable_completion: false
  contextual_suggestions: false
  max_homophones: 7
  max_homographs: 7
  max_sentences: 2
fixed:
  dictionary: yeying20_rime_fixed
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  initial_quality: 100
menu:
  page_size: 9
punctuator:
  import_preset: default
key_binder:
  import_preset: default
  bindings:
  - when: has_menu
    accept: semicolon
    send: 2
  - when: has_menu
    accept: apostrophe
    send: 3
recognizer:
  import_preset: default
  patterns:
    yeying20_lookup: ^([`~][a-z]*|~~[a-z]*)$
yeying:
  native: false
  model_max_input: 36
