<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单字当量从高到低</title><style>body{font:17px/1.65 Microsoft YaHei;margin:30px;background:#f4f6f8;color:#1b3043}main{max-width:1450px;margin:auto}input,select,button{font:inherit;padding:8px;margin:5px;border:1px solid #b8cbd3;border-radius:6px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:10px;border:1px solid #dbe4e8;text-align:left}th{background:#e8eff3;position:sticky;top:0}code{font:18px Consolas,monospace}summary{cursor:pointer}.note{font-size:14px;color:#607583}.scroll{overflow:auto}</style><main><h1>单字键均当量 · 从高到低</h1><p>8105字，默认按主读音最短输入排名。点击拆分一栏可展开每个键对的成本及其他编码。</p><p class="note">使用既有统一当量表。每字独立输入，含提交键，不含跨字转换；键均当量＝键对成本和 ÷ 键对数。␣为空格，;次选，'三选，=翻页。当前纯单字候选顺序；不代表搜狗实际选词键。此排名未乘字频，也不是完整手感评分。</p><p class="note">主读音按冻结字音表自然频率最大者选取；无法匹配的入口单独标注。全部其他读音及编码仍可展开查看。</p><input id="q" placeholder="搜索字、读音、编码、拆分"><select id="band"><option value="999999">全部字</option><option value="500">前500字</option><option value="1500">前1500字</option><option value="3000">前3000字</option><option value="6000">前6000字</option></select><button id="prev">上一页</button><button id="next">下一页</button><p id="status"></p><div class="scroll"><table><thead><tr><th>当量名次</th><th>字</th><th>读音</th><th>键均当量</th><th>实际输入</th><th>字频排名</th><th>拆分 / 成本详情</th></tr></thead><tbody id="body"></tbody></table></div><p><a href="单字当量排行.txt">下载完整TXT</a> · <a href="../58_拆分查询/夜莺2.0拆分查询.html">拆分查询</a></p></main><script>const D=__DATA__;let page=0;const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(){const q=document.querySelector('#q').value.trim(),limit=+document.querySelector('#band').value;let rs=D.map((r,i)=>({...r,rank:i+1})).filter(r=>r.字频<=limit&&(!q||[r.字,r.读音,r.拆分,...r.所有编码.map(x=>x.码)].some(x=>x.includes(q))));page=Math.max(0,Math.min(page,Math.ceil(rs.length/100)-1));document.querySelector('#status').textContent=`${rs.length} 字 · 第 ${page+1} / ${Math.max(1,Math.ceil(rs.length/100))} 页`;document.querySelector('#body').innerHTML=rs.slice(page*100,page*100+100).map(r=>`<tr><td>${r.rank}</td><td><b>${r.字}</b></td><td>${r.读音}</td><td>${r.当量.toFixed(5)}</td><td><code>${esc(r.输入)}</code></td><td>${r.字频}</td><td><details><summary>${esc(r.拆分)}</summary><p>${r.入口说明}</p><p>${r.键对.map(x=>esc(x.键对)+'：'+x.成本.toFixed(3)).join(' / ')}</p>${r.所有编码.map(x=>`<p><code>${esc(x.输入)}</code>：${x.当量.toFixed(5)}（第${x.候选位}候选）</p>`).join('')}</details></td></tr>`).join('')}document.querySelector('#q').oninput=()=>{page=0;render()};document.querySelector('#band').onchange=()=>{page=0;render()};document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};render();</script></html>
