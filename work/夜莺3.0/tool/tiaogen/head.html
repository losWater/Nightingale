<title>夜莺调根台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 布局：顶部指标条 + 左侧键盘 + 右侧详情面板（窄屏上下堆叠） */
:root{
  --bg:#eef1ef; --panel:#fbfcfb; --ink:#18201d; --muted:#65716b; --line:#d3dad6; --key:#ffffff;
  --accent:#1f6f5c; --accent-bg:#d9ece5; --bad:#b23a2e; --bad-bg:#f6dfdb; --good:#1f7a43; --warn:#a86a12; --sel:#2453a6;
  --f-root:"Noto Serif SC","Songti SC",serif; --f-ui:"Noto Sans SC","PingFang SC",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1a211e; --ink:#e4ebe7; --muted:#90a097; --line:#2f3a35; --key:#1e2622;
  --accent:#6fcfb0; --accent-bg:#1d3a31; --bad:#f08a7d; --bad-bg:#40221e; --good:#7fd59c; --warn:#e2b25c; --sel:#8fb2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1a211e; --ink:#e4ebe7; --muted:#90a097; --line:#2f3a35; --key:#1e2622;
  --accent:#6fcfb0; --accent-bg:#1d3a31; --bad:#f08a7d; --bad-bg:#40221e; --good:#7fd59c; --warn:#e2b25c; --sel:#8fb2ff; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);padding-inline:16px;padding-block:16px 40px}
.app{max-width:1500px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-family:var(--f-root);font-size:1.35rem;margin:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
input{font:inherit;font-size:.85rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:11em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#savestat{font-size:.78rem;color:var(--accent)}
select,button{font:inherit;font-size:.85rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer} button:hover{border-color:var(--accent)} button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.metrics{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px}
.mrow{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.total{display:flex;align-items:baseline;gap:10px}
.total b{font-family:var(--f-num);font-size:2rem;font-weight:500}
.gates{display:flex;flex-wrap:wrap;gap:6px}
.gate{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent)}
.gate.fail{background:var(--bad-bg);color:var(--bad);font-weight:700}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
.cell .n{font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.cell .v{font-family:var(--f-num);font-size:1rem;font-variant-numeric:tabular-nums}
.d{font-family:var(--f-num);font-size:.72rem;font-variant-numeric:tabular-nums;margin-left:4px}
.d.up{color:var(--good)} .d.down{color:var(--bad)} .d.zero{color:var(--muted)}
.tiers{overflow-x:auto;font-size:.82rem}
.tiers table{width:auto;min-width:520px}
.tiers td,.tiers th{padding:3px 12px 3px 4px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media (max-width:1100px){.tiers{overflow-x:auto;font-size:.82rem}
.tiers table{width:auto;min-width:520px}
.tiers td,.tiers th{padding:3px 12px 3px 4px}
.main{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:.82rem;color:var(--muted)}
.kscroll{overflow-x:auto}
.kbd{min-width:860px;display:grid;gap:6px}
.row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.row.r2{padding-left:3%;grid-template-columns:repeat(9,minmax(0,1fr)) .6fr}
.row.r3{padding-left:8%;grid-template-columns:repeat(7,minmax(0,1fr)) 2.4fr}
.key{background:var(--key);border:1px solid var(--line);border-radius:7px;padding:4px 5px 6px;min-height:120px;display:flex;flex-direction:column;gap:3px;position:relative;transition:box-shadow .12s}
.key.drop{box-shadow:0 0 0 2px var(--sel)}
.kh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:2px}
.kh b{font-family:var(--f-num);font-size:.95rem;text-transform:uppercase}
.kh small{font-family:var(--f-num);font-size:.68rem;color:var(--muted)}
.heat{position:absolute;inset:0;border-radius:7px;pointer-events:none;background:var(--bad);opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:3px;position:relative}
.chip{font-family:var(--f-root);font-size:.92rem;line-height:1.25;padding:1px 5px;border-radius:5px;border:1px solid transparent;cursor:grab;background:var(--accent-bg);color:var(--ink);user-select:none}
.chip.moved{box-shadow:inset 0 -2px 0 var(--warn)}
.chip.hot{background:var(--bad-bg);color:var(--bad);font-weight:700}
.chip.sel{border-color:var(--sel);outline:1px solid var(--sel)}
.chip .x{font-family:var(--f-num);font-size:.62rem;color:var(--muted);margin-left:2px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;display:grid;gap:8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pane{max-height:70vh;overflow:auto;font-size:.84rem;min-width:0}
.pane h3{font-family:var(--f-root);font-size:1rem;margin:4px 0 6px}
.pane p{margin:4px 0;color:var(--muted);line-height:1.5}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:3px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}
td.num{font-family:var(--f-num);text-align:right}
tr.cur td{background:var(--accent-bg)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-bg)}
.g{font-family:var(--f-root);color:var(--sel);cursor:pointer;text-decoration:underline dotted}
.zi{font-family:var(--f-root);font-size:1rem}
.lastdiff{font-size:.8rem;line-height:1.6;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:6px 8px;max-height:9em;overflow:auto}
.log{font-size:.8rem;line-height:1.6}
.log div{border-bottom:1px solid var(--line);padding:3px 0}
.empty{color:var(--muted);padding:20px;text-align:center}
#loading{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.key{transition:none}}
</style>
