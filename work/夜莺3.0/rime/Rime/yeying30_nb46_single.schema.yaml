schema:
  schema_id: yeying30_nb46_single
  name: 夜莺3.0·NB46单字（试用）
  version: "3.0-nb46-single.4"
  author: [夜莺作者 losWater]
  description: 夜莺3.0候选NB46单字码表试用版（二简ui=事）。操作同2.5单字版；不含2.5的反查与拆分显示。

switches:
  - name: ascii_mode
    states: [中文, 西文]
  - name: ascii_punct
    states: [中文标点, 英文标点]
  - name: simplification
    reset: 0
    states: [简体输出, 繁体输出]

engine:
  processors:
    - lua_processor@*yeying30_nb46_adjust_key
    - lua_processor@*yeying25_mac_lookup_key
    - lua_processor@*yeying25_shape_lookup_input
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@*yeying25_single_english_guard
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators:
    - lua_translator@*yeying30_nb46_lookup
    - punct_translator
    - table_translator
    - lua_translator@*yeying30_nb46_adjust_translator
    - history_translator@repeat_last
    - history_translator@repeat_last_right
  filters:
    - lua_filter@*yeying30_nb46_adjust_filter
    - simplifier@simplification
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz[]"
  auto_clear: manual
  max_code_length: 9
  auto_select: true
  auto_select_pattern: '^;\w+'

translator:
  dictionary: yeying30_nb46_single
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  enable_encoder: false
  encode_commit_history: false

menu:
  page_size: 9
  alternative_select_labels: [㊀, ㊁, ㊂, ㊃, ㊄, ㊅, ㊆, ㊇, ㊈]
punctuator:
  import_preset: default
key_binder:
  bindings:
    - {when: has_menu, accept: semicolon, send: 2}
    - {when: has_menu, accept: apostrophe, send: 3}
    - {when: composing, accept: Tab, send: Escape}
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: has_menu, accept: Right, send: Down}
    - {when: has_menu, accept: Left, send: Up}
    - {when: composing, accept: "Control+o", toggle: simplification}
    - {when: always, accept: "Control+period", toggle: ascii_punct}
recognizer:
  import_preset: default
  patterns:
    yeying30_lookup: '^([`~][a-z]*|~~[a-z]*)$'
simplification:
  option_name: simplification
  opencc_config: s2t.json
  tips: all
repeat_last:
  input: "["
  size: 1
  initial_quality: 100
repeat_last_right:
  input: "]"
  size: 1
  initial_quality: 100
