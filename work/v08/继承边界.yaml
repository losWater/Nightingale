version: "0.8"
scope: root_layout_only

inherit:
  root_set: true
  component_splits: true
  frames: true
  reading_aliases: true
  reading_frequency_overrides: true
  one_code: true
  structural_sequence_overrides:
    - 骂
    - 侯

recompute:
  two_code: true
  three_code: true
  full_code_candidate_order: true
  irrational_codes: true
  tolerance_codes: true
  word_yields: true
  character_word_decisions: true
  short_code_baseline: true

discard_v07_layout_exceptions:
  - 媚
  - 椅
  - 怡
  - 匕
  - 箭
  - 裔

evaluation:
  no_flying_sound_keys: true
  allow_limited_multiple_shape_codes: true
  priority_order:
    - short_code_handfeel
    - three_code_coverage
    - tiered_character_handfeel
    - short_code_duplication
    - full_code_duplication
    - full_code_handfeel
  three_code_reference:
    current_nightingale_top6000: 3300
    simple_crane_top6000: 3690
    direction: increase_toward_reference
  full_code_objective: reduced_weight_with_usability_floor
  character_tiers:
    - {from: 1, to: 300, reference_key_equivalence: 1.32}
    - {from: 301, to: 500, reference_key_equivalence: 1.34}
    - {from: 501, to: 1500, reference_key_equivalence: 1.35}
  shape_positions_only_heatmap: true
  reduce_shape_load_keys: [z, x]
  underused_home_keys: [f, h]
  compare_against: releases/v0.7
