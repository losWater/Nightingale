schema_version: 1
records:
  - id: ADR-0001
    date: 2026-08-27
    status: accepted
    title: 夜莺0.8重新排列字根但不重新选根
    problem: v0.7重码表现达标，但简码手感、分层当量和键位热度仍有改进空间。
    decision:
      - 继承根集、人工拆分、字架、读音修正和结构性重码例外。
      - 不继承布局相关无理码、简码冻结、字词让位及候选顺序。
      - 重新抽取和比较多个字根布局。
    reasons:
      - 专家评审认为字根选择合理，主要问题在排列。
      - 布局下游补丁依赖旧键位，直接继承会污染新实验。
    alternatives:
      - option: 继续微调v0.7
        rejected_because: 容易被既有局部最优和大量下游补丁锁住。
      - option: 重新选根
        rejected_because: 现有根集经过逐音节人工过堂，暂无证据需要推翻。
    affected:
      - work/v08/继承边界.yaml
      - work/v08/README.md
    verification:
      - v0.8预检必须证明旧布局补丁未进入训练资产。

  - id: ADR-0002
    date: 2026-08-27
    status: accepted
    title: 0.8不设飞键并优先优化简码手感
    problem: 音形方案可用飞键改善手感，但会破坏读音规则；当前夜莺三码覆盖和简码手感仍弱于目标。
    decision:
      - 前两码严格保持小鹤双拼。
      - 一简、二简、三码均参加手感评价，简码手感优先于全码手感。
      - 提高三码覆盖目标，降低全码指标的主导权但保留可用底线。
    reasons:
      - 保持方案规则统一和可解释性。
      - 用户实际输入中简码比全码更重要。
    alternatives:
      - option: 对难按音节设置飞键
        rejected_because: 增加无理记忆并破坏统一双拼入口。
    affected:
      - work/v08/退火参数审计.md
    verification:
      - 音码冻结测试。
      - 分层简码手感报告。


  - id: ADR-0003
    date: 2026-09-02
    status: accepted
    title: 0.8.5四码普通词的内容与词序采用简单鹤纯词库
    problem: 夜莺自建的二字四码词表只有6万条且排序无成熟实战依据；同一码位上多字词与二字词的先后（如wjgg 危机公关/玩梗）反复靠个案裁决。
    decision:
      - 四码位上的普通词内容与顺序以简单鹤V9.3.0纯词库为准（鹤系词码规则与夜莺相同）；简单鹤有而夜莺没有的二字词、三字词补入，夜莺独有的词按原相对顺序排在其后。
      - 词码不信简单鹤的码，只信其顺序：按夜莺规则从单字音码重编，多音字优先取与简单鹤一致的读音，其次取多音词纠错建议，再次取主读音；简单鹤飞键因此不进入夜莺。
      - 单字（含扩展字）守当前候选位；字词裁决表与实战问题机器参数表涉及的字词守当前候选位；四码简词若简单鹤同码收录则随其词序，否则守位；一二三码位与快符完全不动；有快符的四码位不新增词。
      - 简词表的四码简词候选位随主表同步更新；扩展字表不变。
    reasons:
      - 简单鹤词库经多年实战打磨，且夜莺简词本就取自简单鹤，词序口径统一。
      - 单字与人工裁决守位，保证既有实战修改与裁决记录不被批量重排冲掉。
    alternatives:
      - option: 按词频阈值逐码位裁决多字词与二字词先后
        rejected_because: 夜莺侧有二字词竞争的四码多字词仅约2千个，且抢位二字词多为冷词，阈值规则会成批误伤。
      - option: 采用鲸凉鹤词库
        rejected_because: 夜莺简词出自简单鹤，混用两家词序口径不一致。
    affected:
      - releases/v0.8.5/01_正式码表/夜莺0.8.5字词表.txt
      - releases/v0.8.5/01_正式码表/夜莺码v0.8.5简词表.tsv
      - releases/v0.8.5/02_输入法挂接/（全部由主表重建）
      - releases/v0.8.5/04_查询与练习/夜莺码v0.8.5编码反查.html
      - work/夜莺0.85/scripts/reorder_v085_words_from_jdhe.py
      - tests/test_reorder_v085_words_from_jdhe.py
    verification:
      - tests/test_reorder_v085_words_from_jdhe.py（单字守位、裁决词守位、简词随简单鹤/守位、飞键重编、多音纠错、短码不动）。
      - 脚本内断言：单字候选位零漂移、合并后无重复无丢失。
      - 实战问题机器参数表全部条目在重建后的手心挂接中逐项复核一致；pipelines/verify.py 通过。
