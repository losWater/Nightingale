<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜莺码 v0.9.1 部件查字</title><style>
@font-face{font-family:Chai;src:url(data:font/ttf;base64,__FONT__)}:root{--bg:#f5f6f8;--card:#fff;--fg:#191c20;--muted:#737984;--accent:#6d3be7;--chip:#f0eaff;--line:#e1e4e8;--soft:#f7f3ff}@media(prefers-color-scheme:dark){:root{--bg:#111419;--card:#1a1e25;--fg:#eceef1;--muted:#9ba1aa;--accent:#b69cff;--chip:#302650;--line:#303640;--soft:#242034}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Chai,"Microsoft YaHei",sans-serif}.wrap{width:min(1050px,100%);margin:auto;padding:42px 16px 70px}h1{font-size:24px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;margin-bottom:17px}.keybox{width:100%;font:24px Consolas,monospace;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}.roots{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 24px}.root{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;font:18px Chai,sans-serif}.root small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.root.on{border-color:var(--accent);background:var(--chip);color:var(--accent)}.summary{display:flex;justify-content:space-between;align-items:end;margin:0 0 10px}.summary h2{font-size:20px;margin:0}.summary span,.empty{color:var(--muted);font-size:13px}.legend{color:var(--muted);font-size:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.char{font-size:35px}.split{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.code{background:var(--chip);color:var(--accent);border-radius:6px;padding:3px 7px;font:14px Consolas,monospace}.code small{color:var(--muted);font:9px Chai,sans-serif;margin-left:3px}</style></head><body><main class="wrap"><h1>夜莺码 v0.9.1 部件查字</h1><div class="sub">输入一个键，选择该键的主根、附属根或锚定根；按两张夜莺完整规范拆分表查询，包括不参与首末编码的中间根。</div><input id="key" class="keybox" maxlength="1" autofocus placeholder="输入字母，例如 y"><div id="roots" class="roots"></div><section id="result"></section></main><script>const DATA=__DATA__,key=document.querySelector('#key'),roots=document.querySelector('#roots'),result=document.querySelector('#result');let selected='';function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function renderRoots(){const k=key.value.toLowerCase().replace(/[^a-z]/g,'').slice(0,1);key.value=k;const rs=DATA.roots.filter(x=>x.key===k);roots.innerHTML=rs.map(x=>`<button class="root ${selected===k+'\0'+x.name?'on':''}" data-name="${esc(x.name)}"><b>${esc(x.name)}</b><small>${x.role}${x.role==='主根'?'':' · 归 '+esc(x.host)}</small></button>`).join('');if(!rs.length){selected='';result.innerHTML=k?'<div class=empty>这个键没有字根。</div>':'';return}if(!selected.startsWith(k+'\0'))selected=k+'\0'+rs[0].name;roots.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=k+'\0'+b.dataset.name;renderRoots();renderResult()});renderResult()}function renderResult(){if(!selected)return;const name=selected.split('\0')[1],rows=DATA.index[selected]||[];result.innerHTML=`<div class=summary><h2>${esc(name)}</h2><span>共 ${rows.length} 字</span></div><div class=legend>结果来自完整规范根序列；编码仍只取首根和末根，因此所选根可能不会出现在形码字母中。</div><div class=grid>${rows.map(x=>`<article class=card><span class=char>${esc(x.char)}</span><div class=split title="${esc(x.split)}">拆分：${esc(x.split)}</div><div class=codes>${x.codes.map(([c,r])=>`<span class=code>${c}<small>${r===1?'首选':'候选'+r}</small></span>`).join('')}</div></article>`).join('')}</div>`}key.addEventListener('input',()=>{selected='';renderRoots()});</script></body></html>
