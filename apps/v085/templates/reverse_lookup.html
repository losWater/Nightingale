<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜莺码 v0.9 编码反查</title><style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#191c20;--muted:#707680;--accent:#6d3be7;--chip:#f0eaff;--line:#e2e5e9}@media(prefers-color-scheme:dark){:root{--bg:#111419;--card:#1a1e25;--fg:#eceef1;--muted:#9ba1aa;--accent:#b69cff;--chip:#302650;--line:#2c323b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:8vh 16px}.wrap{width:min(760px,100%)}h1{font-size:22px;margin:0 0 5px}.sub,.empty{color:var(--muted);font-size:13px}.sub{margin-bottom:18px}input{width:100%;font:22px Consolas,monospace;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:0}.section{margin-top:18px}.section h2{font-size:15px;margin:0 0 9px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:8px 0}.code{color:var(--accent);font:19px Consolas,monospace;margin-right:10px}.count{color:var(--muted);font-size:12px}.items{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.item{background:var(--chip);border-radius:8px;padding:5px 9px;font-size:18px}.item small{color:var(--muted);font-size:11px;margin-left:5px}.word{font-size:16px}.prefix{max-height:55vh;overflow:auto}.hidden{display:none}</style></head><body><main class="wrap"><h1>夜莺码 v0.9 编码反查</h1><div class="sub">数据来自正式挂接字词接口G · 精确码显示完整候选 · 前缀最多展示200个码位</div><input id="q" maxlength="4" autofocus autocomplete="off" spellcheck="false" placeholder="输入编码，例如 jix"><section id="exact" class="section"></section><section id="family" class="section prefix"></section></main><script>const DATA=__DATA__;const q=document.querySelector('#q'),exact=document.querySelector('#exact'),family=document.querySelector('#family');function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function card(code,items){return `<div class=card><span class=code>${code}</span><span class=count>${items.length}项</span><div class=items>${items.map((x,i)=>`<span class="item ${[...x].length>1?'word':''}">${esc(x)}<small>${[...x].length===1?'字':'词'} · ${i+1}</small></span>`).join('')}</div></div>`}function render(){const v=q.value.toLowerCase().replace(/[^a-z]/g,'').slice(0,4);if(q.value!==v)q.value=v;if(!v){exact.innerHTML='';family.innerHTML='';return}const hit=DATA[v];exact.innerHTML=`<h2>精确匹配</h2>${hit?card(v,hit):'<div class=empty>这个码没有候选。</div>'}`;const codes=Object.keys(DATA).filter(x=>x.startsWith(v)&&x!==v).slice(0,200);family.innerHTML=`<h2>前缀家族（${codes.length}${codes.length===200?'＋':''}个码位）</h2>${codes.length?codes.map(x=>card(x,DATA[x])).join(''):'<div class=empty>没有更长的同前缀码。</div>'}`}q.addEventListener('input',render)</script></body></html>
