<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜莺码 v0.9.1 拆分查询</title><style>
@font-face{font-family:Chai;src:url(data:font/ttf;base64,__FONT__)}:root{--bg:#f5f6f8;--card:#fff;--fg:#191c20;--muted:#707680;--accent:#6d3be7;--chip:#f0eaff;--line:#e2e5e9}@media(prefers-color-scheme:dark){:root{--bg:#111419;--card:#1a1e25;--fg:#eceef1;--muted:#9ba1aa;--accent:#b69cff;--chip:#302650;--line:#2c323b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Chai,"Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:8vh 16px}.wrap{width:min(680px,100%)}h1{font-size:22px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}input{width:100%;font:inherit;font-size:22px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:0}.list{display:grid;gap:11px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.char{font-size:35px;margin-right:12px}.split{color:var(--muted)}.split b{color:var(--accent);font-size:18px}.codes{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{background:var(--chip);color:var(--accent);border-radius:8px;padding:4px 9px;font:17px Consolas,monospace}.chip small{color:var(--muted);font:12px Chai,sans-serif;margin-left:5px}</style></head><body><main class="wrap"><h1>夜莺码 v0.9.1 拆分查询</h1><div class="sub">正式单字接口 C v5 · 输入汉字查看简码、全码、候选位与8105规范拆分</div><input id="q" autofocus placeholder="输入汉字……"><div id="out" class="list"></div></main><script>const DATA=__DATA__;const q=document.querySelector('#q'),out=document.querySelector('#out');function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function render(){out.innerHTML='';for(const ch of [...q.value].filter(x=>/\S/.test(x)).slice(0,50)){const d=DATA[ch],card=document.createElement('section');card.className='card';if(!d){card.innerHTML=`<span class=char>${esc(ch)}</span><span class=split>不在码表中</span>`}else{const chips=d.codes.map(([c,r])=>`<span class=chip>${c}<small>${r===1?'首选':'第'+r+'候选'}</small></span>`).join('');card.innerHTML=`<span class=char>${esc(ch)}</span>${d.split?`<span class=split>拆分 <b>${esc(d.split)}</b></span>`:'<span class=split>暂无规范拆分</span>'}<div class=codes>${chips}</div>`}out.append(card)}}q.addEventListener('input',render)</script></body></html>
