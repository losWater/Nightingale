<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜莺码 v0.9 必拆字练习</title><style>
@font-face{font-family:Chai;src:url(data:font/ttf;base64,__FONT__)}:root{--ink:#62738e;--muted:#91a0b7;--line:#e3e8f0;--card:rgba(255,255,255,.76);--good:#55b895;--bad:#ff4452;--glow:#dbeaff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Chai,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 72% 4%,#dcedff 0,transparent 29%),radial-gradient(circle at 49% 0,#f3e8ff 0,transparent 25%),#fff}.app{min-height:100vh;padding:36px 22px 60px}.top{width:min(760px,calc(100vw - 36px));height:88px;margin:0 auto;border:1px solid var(--line);border-radius:46px;background:var(--card);box-shadow:0 2px 8px #60779914;display:flex;align-items:center;padding:0 29px;gap:18px;backdrop-filter:blur(14px)}button{font:inherit;color:inherit}.menu{border:0;background:transparent;font-size:25px;cursor:pointer;padding:8px}.divider{width:1px;height:44px;background:#d8dee8}.title{font-size:20px;font-weight:700;white-space:nowrap}.spacer{flex:1}.stats{text-align:right;line-height:1.2}.percent{font:700 21px Arial}.count{font:20px Arial;color:#71819b;margin-top:4px}.ring{width:54px;height:54px;border:6px solid #e7ebf2;border-radius:50%;background:conic-gradient(var(--good) var(--progress),transparent 0);position:relative}.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fdfdff}.stage{min-height:690px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:80px 0 120px}.char{font-size:68px;line-height:1;margin-bottom:52px;color:#61728d}.answer{min-height:76px;display:flex;gap:13px;justify-content:center}.cell,.bar{height:72px;border:1px solid #dfe4eb;background:#fff;border-radius:12px;box-shadow:0 5px 9px #52637b20;display:flex;align-items:center;justify-content:center;font:45px Arial;color:#64748d;transition:.2s}.cell{width:72px}.bar{width:292px;letter-spacing:.22em;padding-left:.22em}.answer.bad .cell,.answer.bad .bar{color:var(--bad);border-color:#ffc6ca;animation:shake .35s}.answer.good .cell,.answer.good .bar{color:var(--good);border-color:#b8ead9;box-shadow:0 0 0 7px #daf6ec99,0 5px 9px #52637b18}.reading{height:28px;margin-top:19px;color:#8c9bb0;font:18px Arial,"Microsoft YaHei",sans-serif}.split{height:42px;margin-top:15px;font-size:22px;opacity:0;transform:translateY(8px);transition:.3s;color:#7a89a1}.split.show{opacity:1;transform:none}.notice{height:25px;margin-top:8px;color:#9aa7ba;font-size:14px}.hidden-input{position:fixed;opacity:0;pointer-events:none}.success-burst{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 52%,#d8fff0aa 0,transparent 20%)}.success-burst.on{animation:burst 1s}.overlay{position:fixed;inset:0;background:#f8faffee;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;z-index:4;padding:24px}.overlay.hide{display:none}.panel{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 60px #60779926;padding:34px}.panel h2{margin:0 0 8px;font-size:27px}.panel p{margin:0 0 25px;color:#8a98ac;line-height:1.7}.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{border:1px solid var(--line);border-radius:17px;background:#fafbfe;padding:22px 15px;cursor:pointer;text-align:left}.mode:hover{border-color:#aac9f4;background:#f3f8ff}.mode b{display:block;font-size:20px;margin-bottom:7px}.mode span{font-size:13px;color:#929fb1;line-height:1.5}.panel-actions{display:flex;gap:10px;margin-top:22px}.secondary{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.done{text-align:center}.done h2{font-size:31px}.done strong{font:700 52px Arial;color:var(--good)}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes burst{0%{opacity:0}28%{opacity:1}100%{opacity:0;transform:scale(1.35)}}@media(max-width:620px){.app{padding:18px 10px}.top{height:72px;padding:0 17px;gap:10px}.title{font-size:16px}.ring{width:44px;height:44px}.stage{min-height:620px;padding-top:50px}.char{font-size:60px}.cell{width:61px;height:64px}.bar{height:64px;width:250px}.modes{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><button class="menu" id="menu" aria-label="设置">☷</button><span class="divider"></span><span class="title">▣ 必拆字练习</span><span class="spacer"></span><div class="stats"><div class="percent" id="percent">0%</div><div class="count" id="count">1/1</div></div><div class="ring" id="ring"></div></header><section class="stage" id="stage"><div class="char" id="char"></div><div class="answer" id="answer"></div><div class="reading" id="reading"></div><div class="split" id="split"></div><div class="notice" id="notice"></div><input class="hidden-input" id="input" autocomplete="off" autocapitalize="off" spellcheck="false"></section></main><div class="success-burst" id="burst"></div><div class="overlay" id="overlay"><section class="panel" id="panel"><h2>选择练习模式</h2><p>两种模式分别记录进度，可以随时切换。界面不会提示当前正在练习的字根。</p><div class="modes"><button class="mode" data-mode="full"><b>全码模式</b><span>四个输入格，输入正式四码；多音字接受任一正式全码。</span></button><button class="mode" data-mode="short"><b>简码模式</b><span>长条输入框，输入该字最短的正式编码。</span></button></div><div class="panel-actions"><button class="secondary" id="continue" hidden>继续当前练习</button><button class="secondary" id="reset">重置当前模式</button></div></section></div><script>
const QUESTIONS=__DATA__,STORE='nightingale-v085-must-split-v2';let mode='',typed='',failures=0,locked=false;const $=id=>document.getElementById(id),input=$('input'),answer=$('answer'),split=$('split'),notice=$('notice'),overlay=$('overlay');function load(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch{return {}}}let state=load();function modeState(m){return state[m]||(state[m]={index:0,done:0,firstTry:0,totalFailures:0})}function save(){localStorage.setItem(STORE,JSON.stringify(state))}function q(){return QUESTIONS[modeState(mode).index%QUESTIONS.length]}function targets(){return mode==='full'?q().full:q().short}function expectedLength(){return targets()[0].length}function render(){const s=modeState(mode),item=q(),pct=Math.round(s.done/QUESTIONS.length*100);$('char').textContent=item.char;$('percent').textContent=pct+'%';$('count').textContent=(s.index%QUESTIONS.length+1)+'/'+QUESTIONS.length;$('ring').style.setProperty('--progress',pct*3.6+'deg');answer.className='answer';answer.innerHTML='';if(mode==='full'){for(let i=0;i<4;i++){const c=document.createElement('span');c.className='cell';c.textContent=typed[i]||'';answer.append(c)}}else{const b=document.createElement('span');b.className='bar';b.textContent=typed;answer.append(b)}$('reading').textContent=item.pinyin.length?'读音：'+item.pinyin.join(' / '):'读音：暂无';split.className='split';split.textContent='';notice.textContent=failures?`本字已失败 ${failures} 次${failures<5?'，连续五次后显示拆分':''}`:'';input.value=typed;setTimeout(()=>input.focus(),0)}function showSplit(text){split.textContent=q().split.join(' ＋ ');split.classList.add('show');notice.textContent=text||''}function wrong(){if(locked)return;failures++;modeState(mode).totalFailures++;save();answer.classList.add('bad');if(failures>=5)showSplit('连续五次失败，已显示拆分');else notice.textContent=`本字已失败 ${failures} 次，连续五次后显示拆分`;locked=true;setTimeout(()=>{typed='';locked=false;render();if(failures>=5)showSplit('连续五次失败，已显示拆分')},470)}function correct(){if(locked)return;locked=true;answer.classList.add('good');showSplit('正确');$('burst').classList.add('on');const s=modeState(mode);s.done=Math.min(QUESTIONS.length,s.done+1);if(failures===0)s.firstTry++;save();setTimeout(()=>{s.index=(s.index+1)%QUESTIONS.length;if(s.index===0&&s.done>=QUESTIONS.length){save();complete();return}typed='';failures=0;locked=false;$('burst').classList.remove('on');save();render()},1000)}function evaluate(){const ts=targets();if(ts.includes(typed)){correct();return}if(mode==='full'){if(typed.length>=4)wrong()}else if(!ts.some(t=>t.startsWith(typed))||typed.length>=expectedLength()){wrong()}}function typeKey(key){if(!mode||locked)return;if(key==='Backspace'){typed=typed.slice(0,-1);render();if(failures>=5)showSplit('连续五次失败，已显示拆分');return}if(!/^[a-z]$/.test(key)||typed.length>=expectedLength())return;typed+=key;render();if(failures>=5)showSplit('连续五次失败，已显示拆分');evaluate()}function choose(m){mode=m;typed='';failures=0;locked=false;overlay.classList.add('hide');save();render()}function openMenu(){overlay.classList.remove('hide');$('continue').hidden=!mode;$('continue').textContent=mode?`继续${mode==='full'?'全码':'简码'}模式`:''}function complete(){const s=modeState(mode);$('panel').innerHTML=`<div class="done"><strong>✓</strong><h2>本轮练习完成</h2><p>共 ${QUESTIONS.length} 字，首次答对 ${s.firstTry} 字。</p><button class="secondary" id="again">再练一轮</button></div>`;overlay.classList.remove('hide');$('again').onclick=()=>{state[mode]={index:0,done:0,firstTry:0,totalFailures:0};save();location.reload()}}document.addEventListener('keydown',e=>{if(!overlay.classList.contains('hide'))return;if(e.key==='Backspace'||/^[a-zA-Z]$/.test(e.key)){e.preventDefault();typeKey(e.key==='Backspace'?'Backspace':e.key.toLowerCase())}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));$('menu').onclick=openMenu;$('continue').onclick=()=>{overlay.classList.add('hide');typed='';failures=0;render()};$('reset').onclick=()=>{if(!mode)return;state[mode]={index:0,done:0,firstTry:0,totalFailures:0};save();typed='';failures=0;overlay.classList.add('hide');render()};$('stage').onclick=()=>input.focus();input.addEventListener('input',()=>{const value=input.value.toLowerCase().replace(/[^a-z]/g,'');const added=value.slice(typed.length);for(const ch of added)typeKey(ch);input.value=typed});if(state.lastMode){mode=state.lastMode;$('continue').hidden=false;$('continue').textContent=`继续${mode==='full'?'全码':'简码'}模式`}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.lastMode=b.dataset.mode;save()}));
</script></body></html>
