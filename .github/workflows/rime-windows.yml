name: Verify and publish Windows Rime
# 版本号与日期在运行时填写（Actions → Verify and publish Windows Rime → Run workflow），本文件不写死任何版本。
# Mac 包与校验值直接从发布页 v<version> 读取；Windows 包验证通过后上传到同一发布页。
# push 触发时只构建和验证最新发布的版本，不上传。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 3.0（发布页 v3.0 上须已有三个 Mac 包）'
        required: true
      stamp:
        description: '文件名日期 YYYYMMDD，留空用今天'
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/rime-windows.yml'
      - 'tools/rime_windows/**'
      - 'tools/rime_mac/rime_probe.c'
      - 'tools/rime_mac/release_checks.py'
permissions:
  contents: read
concurrency:
  group: rime-windows-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version and stamp
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v') }
          $stamp = '${{ inputs.stamp }}'
          if (-not $stamp) { $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd') }
          "version=$version" >> $env:GITHUB_OUTPUT
          "stamp=$stamp" >> $env:GITHUB_OUTPUT
          echo "version=$version stamp=$stamp"
      - name: Build Windows packages from the release's Mac packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/rime_windows/package_release.py --repo $env:GITHUB_REPOSITORY --version ${{ steps.v.outputs.version }} --stamp ${{ steps.v.outputs.stamp }} --source-dir "$env:RUNNER_TEMP/source" --upstream "$env:RUNNER_TEMP/upstream.zip" --output "$env:RUNNER_TEMP/windows-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile native Windows probe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /utf-8 /O2 tools\rime_mac\rime_probe.c /Fe:"%RUNNER_TEMP%\rime_probe.exe"
      - name: Verify actual ZIPs with official Weasel engine
        shell: pwsh
        run: |
          python tools/rime_windows/verify_release.py "$env:RUNNER_TEMP/windows-release" --probe "$env:RUNNER_TEMP/rime_probe.exe" --work "$env:RUNNER_TEMP/windows-test"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rime-evidence
          path: |
            ${{ runner.temp }}/windows-test/*.txt
            ${{ runner.temp }}/windows-release/*.json
            ${{ runner.temp }}/windows-release/*.txt
          retention-days: 30
      - name: Upload verified packages without overwriting existing assets
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "$env:RUNNER_TEMP/windows-release"
          $files = @(Get-ChildItem "$dir/Nightingale-Rime-*-windows-*.zip", "$dir/SHA256SUMS-windows-*.txt", "$dir/windows-verification.json" | ForEach-Object FullName)
          gh release upload "v${{ steps.v.outputs.version }}" @files --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
