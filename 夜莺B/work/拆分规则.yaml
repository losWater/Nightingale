# 夜莺B 人工拆分约束。这里只记录已经裁决、不能可靠交给 chai 自动推导的规则。
# component_splits 会编译到 config.analysis.customize，必须覆盖部件的完整根序列。
# boundary_candidates 只用于选根阶段的反事实检查，不进入正式拆分。
component_splits:
  每: [卧人, 母]
  中: [口, 竖]
  上: [卜, 横]
  下: [横, 卜]
  虍: [卜, 厂, 匕]
  妻字头: [横, 肀]
  事: [横, 口, 争字底]
  史: [口, 乂]
  吏: [横, 口, 乂]
  头: [点, 大]
  武: [横, 弋, 止]

# 夜莺B自定义部件。值为不与 chai 字库冲突的稳定 PUA。
custom_elements:
  互中间: "\uE849"

# 交叉借笔结构无法用 chai 的 component_splits 表达；这里覆写最终整字根序列。
sequence_overrides:
  羲: [点, 点, 王, 禾, 戈, 横, 折]
  曦: [日, 点, 点, 王, 禾, 戈, 横, 折]
  爔: [火, 点, 点, 王, 禾, 戈, 横, 折]
  彖: [互中间, 豕]
  缘: [纟, 互中间, 豕]
  喙: [口, 互中间, 豕]
  篆: [竹头, 互中间, 豕]
  椽: [木, 互中间, 豕]
  掾: [扌, 互中间, 豕]
  橼: [木, 互中间, 豕]
  瑑: [王, 互中间, 豕]
  禒: [礻, 互中间, 豕]
  蠡: [互中间, 豕, 虫, 虫]
  临: [览字头, 囗, 竖]
  庸: [广, 折, 二, 冂, 举字底]
  墉: [土, 广, 折, 二, 冂, 举字底]
  慵: [忄, 广, 折, 二, 冂, 举字底]
  镛: [钅, 广, 折, 二, 冂, 举字底]
  鳙: [鱼, 广, 折, 二, 冂, 举字底]
  鄘: [广, 折, 二, 冂, 举字底, 阝]
  隶: [争字底, 氺]
  逮: [争字底, 氺, 辶]

# 字架最终会编译为 data.glyph_customization / transformers；目前先保存裁决语义。
frames:
  衣:
    examples: {哀: 口, 衰: "口+横", 裹: 果}
    note: "⿳亠X衣省 字按衣字架取首，中间件取末；具体批量变换待接入"
  行:
    examples: {街: 圭}
    note: "⿲彳X亍 → 行字架+X"
  辡:
    host: 辛
    examples: {辩: 讠, 辨: 刂, 瓣: 瓜, 辫: 纟}
  玨:
    host: 王
    examples: {班: 刂, 斑: 文}

# 人工边界说明，供检查器与后续审计理解规则来源。
boundary_candidates:
  虍:
    head: 卜
    tail: 匕
    decision: 不立根
    note: "首末根原理：卜已承担首码功能；无根案按人工规则拆卜+厂+匕"
  秉:
    head: 秉
    tail: 秉
    decision: 独立根并锚定争字底
    note: "肀立根后 chai 会跨笔画误取秉；现以秉整字独立成根解决边界，键位锚定争字底，但不是争字底的附属"
