# 夜莺B 人工拆分约束。这里只记录已经裁决、不能可靠交给 chai 自动推导的规则。
# component_splits 会编译到 config.analysis.customize，必须覆盖部件的完整根序列。
# boundary_candidates 只用于选根阶段的反事实检查，不进入正式拆分。
component_splits:
  重: [千, 里]
  万: [横, 撇, 折]
  丑: [折, 土]
  我: [我四, 戈]
  成: [戊, 折]
  尹: [争字底, 撇]
  兆: [冫, 冫, 儿]
  庚字心: [争字底, 人]
  每: [卧人, 母]
  中: [口, 竖]
  上: [卜, 横]
  下: [横, 卜]
  虍: [卜, 厂, 匕]
  妻字头: [横, 肀]
  事: [横, 口, 争字底]
  史: [口, 乂]
  吏: [横, 口, 乂]
  头: [冬字底, 大]
  尽: [尺, 冬字底]
  武: [横, 弋, 止]

# 夜莺B自定义部件。值为不与 chai 字库冲突的稳定 PUA。
custom_elements:
  互中间: "\uE849"
  赢字架: "\uE84E"
  襄省: "\uE83C"  # chai 名“囊下”，即襄去掉亠

# 二简位按当前读音本身的频率排序；若整个音节没有有效频率候选，可人工指定。
two_code_overrides:
  mq: 谬
  qk: 轻
  qu: 取
  dd: 代

# 三码位“谕旨”：按单字直接输入倾向人工指定赢家；生成码表时自动应用。
# 语义等价于只在该三码竞争堆中降低其他字的优先权，不能用词组总字频机械决定。
short_code_overrides:
  cj:
    夕: 残
  pu:
    亻: 仆
  tk:
    广: 庭
  jl:
    亻: 僵
  vi:
    至: 致
  ji:
    己: 忌
    夕: 祭
  do:
    刀: 剁
  ww:
    卩: 卫
  qk:
    讠: 请
    广: 庆
  lu:
    阝: 陆
  wu:
    卧人: 舞
  yu:
    俞: 俞
  qu:
    匚: 区
    耳: 娶
  dd:
    艹: 带
    亻: 岱
  lq:
    石: 硫
  jn:
    纟: 缴
  dj:
    讠: 诞

# 同码候选顺序／“全码让位”谕旨：用于多音字总频复制等导致的错误候选先后。
# 列表从前到后排列；未列出的同码字仍按正常频率顺序接在后面。
candidate_order_overrides:
  kajg: [喀, 咯]
  puql: [蒲, 葡]
  bigg: [毙, 匕, 比]
  vaar: [榨, 栅]
  vuqr: [贮, 苎]
  qkmr: [箐, 请]
  jmmo: [箭, 谫]
  yigl: [裔, 疑]
  yigj: [裔, 饴]

# 实际输入音别名；不足两键的音码按小鹤规则双击。frequency 为该入口独立权重。
reading_aliases:
  嗯:
    - {code: en, frequency: 157982, sound: [szm-e, mzm-n]}
    - {code: ng, frequency: 0, sound: [szm-n, mzm-ng]}
  谁:
    - {code: uw, frequency: 1508124, sound: [szm-sh, mzm-ei], anneal: false}
    - {code: uv, frequency: 377031, sound: [szm-sh, mzm-ui]}
  噢:
    - {code: ao, frequency: 0, sound: [szm-a, mzm-ao]}

# 已存在读音入口的频率重排；保留旧音作为容错，但不让它参与主码评测。
reading_frequency_overrides:
  嗯: {en: 157982, ng: 0}
  谁: {uv: 377031}

# 交叉借笔结构无法用 chai 的 component_splits 表达；这里覆写最终整字根序列。
sequence_overrides:
  乘: [禾, 北字旁, 匕]
  剩: [禾, 北字旁, 匕, 刀]
  嵊: [山, 禾, 北字旁, 匕]
  年: [卧人, 土, 竖]
  承: [了, 三, 水]
  兵: [丘, 八]
  戌: [戊, 横]
  戍: [戊, 点]
  庚: [广, 争字底, 人]
  羲: [点, 点, 王, 禾, 戈, 横, 折]
  曦: [日, 点, 点, 王, 禾, 戈, 横, 折]
  爔: [火, 点, 点, 王, 禾, 戈, 横, 折]
  彖: [互中间, 豕]
  缘: [纟, 互中间, 豕]
  喙: [口, 互中间, 豕]
  篆: [竹头, 互中间, 豕]
  椽: [木, 互中间, 豕]
  掾: [扌, 互中间, 豕]
  橼: [木, 互中间, 豕]
  瑑: [王, 互中间, 豕]
  禒: [礻, 互中间, 豕]
  蠡: [互中间, 豕, 虫, 虫]
  临: [览字头, 囗, 竖]
  庸: [广, 折, 二, 冂, 举字底]
  墉: [土, 广, 折, 二, 冂, 举字底]
  慵: [忄, 广, 折, 二, 冂, 举字底]
  镛: [钅, 广, 折, 二, 冂, 举字底]
  鳙: [鱼, 广, 折, 二, 冂, 举字底]
  鄘: [广, 折, 二, 冂, 举字底, 阝]
  隶: [争字底, 氺]
  逮: [争字底, 氺, 辶]
  # 前1500同音同首末硬碰撞：按主人裁决强制最终码元序列。
  骂: [口, 口]
  侯: [亻, 竖]
  # 无理码：违反统一首末取根，改按顺序取“女 + 眉字框（尸家）”。
  媚: [女, 尸]
  # 无理码：箭按书写顺序取前两根“竹头＋八”；自然首末码 jmmo 另作容错。
  箭: [竹头, 八]
  # 无理码（有记忆成本）：裔顺取“衣＋冂”；自然首末码 yigj 另作容错。
  裔: [衣, 冂]
  # 匕本字按规范笔顺拆“撇、竖弯钩（折）”；匕根家族本身不拆。
  匕: [撇, 折]
  # 无理码（顺取）：椅由“木＋大”取码，避开自然码 yian 的常用词“议案”。
  椅: [木, 大]
  # 无理码（顺取）：怡由“忄＋厶”取码，避开自然码 yivj 的常用词组。
  怡: [忄, 厶]

# 字架最终会编译为 data.glyph_customization / transformers；目前先保存裁决语义。
frames:
  衣:
    examples: {哀: 口, 衰: "口+横", 裹: 果}
    note: "⿳亠X衣省 字按衣字架取首，中间件取末；具体批量变换待接入"
  行:
    examples: {街: 圭}
    note: "⿲彳X亍 → 行字架+X"
  辡:
    host: 辛
    examples: {辩: 讠, 辨: 刂, 瓣: 瓜, 辫: 纟}
  玨:
    host: 王
    examples: {班: 刂, 斑: 文}
  赢:
    host: 赢字架
    examples: {赢: 贝, 嬴: 女, 羸: 羊, 蠃: 虫, 臝: 果}
    note: "吂+月X凡 → 赢字架+X；用于赢／嬴／羸／蠃／臝并传播到瀛等嵌套用户"
  襄:
    host: 衣
    structural_only: true
    note: "襄保留字架身份并挂衣键；当前字库尚无向襄架内另塞部件的用户"

# 人工边界说明，供检查器与后续审计理解规则来源。
boundary_candidates:
  虍:
    head: 卜
    tail: 匕
    decision: 不立根
    note: "首末根原理：卜已承担首码功能；无根案按人工规则拆卜+厂+匕"
  秉:
    head: 秉
    tail: 秉
    decision: 独立根并锚定争字底
    note: "肀立根后 chai 会跨笔画误取秉；现以秉整字独立成根解决边界，键位锚定争字底，但不是争字底的附属"
