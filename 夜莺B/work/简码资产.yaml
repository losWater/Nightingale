# 综合字词表中，人工让位码明确指定唯一获得首选的词；避免词库重排改变裁决。
# 未列出的人工／自动让位码仍取精选二字词表中排名最高的一词。
word_first_overrides:
  jmmo: 建模

# 人工词位让出补偿码：指定字在让出四码首选后，补到其三码二选。
# 不随低频字自动让位规则扩散。
word_yield_three_secondaries:
  vuqr: 贮
  bclo: 刨
  yutn: 尉
  yijk: 咿
  wumd: 诬
  liqk: 荔
  qiya: 鳍
  viya: 酯
  svyr: 隋
  doda: 朵
  wwtn: 尉
  qiug: 岐

# 低频字默认向常用词让位。若同一码还含阈值以内的常用字，则不自动处理。
default_word_first:
  character_rank_from: 3762
  two_word_rank_top: 30000

