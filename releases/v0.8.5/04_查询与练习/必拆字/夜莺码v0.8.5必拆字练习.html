textContent=typed[i]||'';answer.append(c)}}else{const b=document.createElement('span');b.className='bar';b.textContent=typed;answer.append(b)}$('reading').textContent=item.pinyin.length?'读音：'+item.pinyin.join(' / '):'读音：暂无';split.className='split';split.textContent='';notice.textContent=failures?`本字已失败 ${failures} 次${failures<5?'，连续五次后显示拆分':''}`:'';input.value=typed;setTimeout(()=>input.focus(),0)}function showSplit(text){split.textContent=q().split.join(' ＋ ');split.classList.add('show');notice.textContent=text||''}function wrong(){if(locked)return;failures++;modeState(mode).totalFailures++;save();answer.classList.add('bad');if(failures>=5)showSplit('连续五次失败，已显示拆分');else notice.textContent=`本字已失败 ${failures} 次，连续五次后显示拆分`;locked=true;setTimeout(()=>{typed='';locked=false;render();if(failures>=5)showSplit('连续五次失败，已显示拆分')},470)}function correct(){if(locked)return;locked=true;answer.classList.add('good');showSplit('正确');$('burst').classList.add('on');const s=modeState(mode);s.done=Math.min(QUESTIONS.length,s.done+1);if(failures===0)s.firstTry++;save();setTimeout(()=>{s.index=(s.index+1)%QUESTIONS.length;if(s.index===0&&s.done>=QUESTIONS.length){save();complete();return}typed='';failures=0;locked=false;$('burst').classList.remove('on');save();render()},1000)}function evaluate(){const ts=targets();if(ts.includes(typed)){correct();return}if(mode==='full'){if(typed.length>=4)wrong()}else if(!ts.some(t=>t.startsWith(typed))||typed.length>=expectedLength()){wrong()}}function typeKey(key){if(!mode||locked)return;if(key==='Backspace'){typed=typed.slice(0,-1);render();if(failures>=5)showSplit('连续五次失败，已显示拆分');return}if(!/^[a-z]$/.test(key)||typed.length>=expectedLength())return;typed+=key;render();if(failures>=5)showSplit('连续五次失败，已显示拆分');evaluate()}function choose(m){mode=m;typed='';failures=0;locked=false;overlay.classList.add('hide');save();render()}function openMenu(){overlay.classList.remove('hide');$('continue').hidden=!mode;$('continue').textContent=mode?`继续${mode==='full'?'全码':'简码'}模式`:''}function complete(){const s=modeState(mode);$('panel').innerHTML=`<div class="done"><strong>✓</strong><h2>本轮练习完成</h2><p>共 ${QUESTIONS.length} 字，首次答对 ${s.firstTry} 字。</p><button class="secondary" id="again">再练一轮</button></div>`;overlay.classList.remove('hide');$('again').onclick=()=>{state[mode]={index:0,done:0,firstTry:0,totalFailures:0};save();location.reload()}}document.addEventListener('keydown',e=>{if(!overlay.classList.contains('hide'))return;if(e.key==='Backspace'||/^[a-zA-Z]$/.test(e.key)){e.preventDefault();typeKey(e.key==='Backspace'?'Backspace':e.key.toLowerCase())}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));$('menu').onclick=openMenu;$('continue').onclick=()=>{overlay.classList.add('hide');typed='';failures=0;render()};$('reset').onclick=()=>{if(!mode)return;state[mode]={index:0,done:0,firstTry:0,totalFailures:0};save();typed='';failures=0;overlay.classList.add('hide');render()};$('stage').onclick=()=>input.focus();input.addEventListener('input',()=>{const value=input.value.toLowerCase().replace(/[^a-z]/g,'');const added=value.slice(typed.length);for(const ch of added)typeKey(ch);input.value=typed});if(state.lastMode){mode=state.lastMode;$('continue').hidden=false;$('continue').textContent=`继续${mode==='full'?'全码':'简码'}模式`}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.lastMode=b.dataset.mode;save()}));
